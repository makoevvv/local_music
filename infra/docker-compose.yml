services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-local_music}
      POSTGRES_USER: ${POSTGRES_USER:-music}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-music} -d ${POSTGRES_DB:-local_music}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  proxy:
    image: ghcr.io/sagernet/sing-box:v1.11.5
    profiles: ["proxy"]
    restart: unless-stopped
    volumes:
      - ./proxy/sing-box.config.json:/etc/sing-box/config.json:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]

  # YouTube PO Token — avoids manual browser cookies (see bgutil-ytdlp-pot-provider).
  ytdlp-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    init: true
    restart: unless-stopped
    environment:
      HTTP_PROXY: ${YTDLP_PROXY:-}
      HTTPS_PROXY: ${YTDLP_PROXY:-}

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-music}:${POSTGRES_PASSWORD:-change-me-db}@postgres:5432/${POSTGRES_DB:-local_music}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ../data/storage:/data/storage
      - ../data/exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ytdlp-pot:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-music}:${POSTGRES_PASSWORD:-change-me-db}@postgres:5432/${POSTGRES_DB:-local_music}
    command:
      [
        "python",
        "-m",
        "app.workers",
        "worker",
        "--with-scheduler",
        "default",
        "--url",
        "redis://redis:6379/0",
      ]
    volumes:
      - ../data/storage:/data/storage
      - ../data/exports:/data/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ytdlp-pot:
        condition: service_started
    restart: unless-stopped

  # Production edge: static web + Caddy, and Cloudflare Tunnel.
  # docker compose -p local_music -f infra/docker-compose.yml --profile edge up -d --build
  caddy:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    profiles: ["edge"]
    restart: unless-stopped
    command:
      ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on:
      - caddy

  # Optional health-check UI. Not published beyond the host loopback.
  # docker compose -p local_music -f infra/docker-compose.yml --profile monitor up -d
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.12
    profiles: ["monitor"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma:/app/data
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  uptime_kuma:
